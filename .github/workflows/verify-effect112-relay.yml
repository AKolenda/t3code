name: Verify Effect upgrade relay

on:
  push:
    branches:
      - t3code/verify-effect112-relay

permissions:
  contents: read
  id-token: none

concurrency:
  group: relay-dev-julius-effect112
  cancel-in-progress: false

jobs:
  deploy_relay:
    name: Deploy personal relay
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 15
    environment:
      name: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_DOMAIN: ""
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...

      - name: Inspect Cloudflare token permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root = "https://api.cloudflare.com/client/v4";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` };
          async function get(path) {
            const response = await fetch(root + path, { headers });
            const body = await response.json();
            console.log(JSON.stringify({ endpoint: path.replace(account, "ACCOUNT"), status: response.status, success: body.success, errors: body.errors?.map(({code,message}) => ({code,message})) }));
            return body;
          }
          let info = await get(`/accounts/${account}/tokens/verify`);
          if (info.success && info.result?.id) {
            const detail = await get(`/accounts/${account}/tokens/${info.result.id}`);
            if (detail.success) console.log(JSON.stringify({ name: detail.result.name, policies: detail.result.policies?.map(p => ({effect: p.effect, permission_groups: p.permission_groups, resources: p.resources})) }));
          } else {
            info = await get("/user/tokens/verify");
            if (info.success && info.result?.id) {
              const detail = await get(`/user/tokens/${info.result.id}`);
              if (detail.success) console.log(JSON.stringify({ name: detail.result.name, policies: detail.result.policies?.map(p => ({effect: p.effect, permission_groups: p.permission_groups, resources: p.resources})) }));
            }
          }
          await get(`/accounts/${account}/tokens/permission_groups`);
          JS
