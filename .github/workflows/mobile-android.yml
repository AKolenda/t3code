name: Android Notifications

on:
  pull_request:
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/mobile-android.yml
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/client-runtime/**
      - packages/contracts/**
      - packages/shared/**
      - assets/**
      - scripts/**
      - patches/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/mobile-android.yml

concurrency:
  group: android-notifications-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native_tests:
    name: Android notification compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      APP_VARIANT: development
      EXPO_NO_DOTENV: "1"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --frozen-lockfile

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # Exercise Expo autolinking and the real native dependency graph. These
      # tests need no Firebase project, device, signing key or relay secrets.
      - name: Generate Android project
        working-directory: apps/mobile
        run: vp exec expo prebuild --platform android --no-install

      - name: Compile, test supported Android versions, and lint
        working-directory: apps/mobile/android
        run: ./gradlew :t3-agent-notifications:testDebugUnitTest :t3-agent-notifications:lintRelease --no-daemon --console=plain

      - name: Upload native test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-notification-reports
          path: apps/mobile/modules/t3-agent-notifications/android/build/reports/
          if-no-files-found: ignore
          retention-days: 14
