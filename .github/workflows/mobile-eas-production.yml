# Staging-only workflow on staging/android-pr10416. This branch is not for merging.
name: Android relay staging verification

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Plan isolated relay, deploy it, or start its Android APK build
        type: choice
        required: true
        default: plan
        options: [plan, deploy, build]

permissions:
  contents: read

concurrency:
  group: relay-staging-android-10416
  cancel-in-progress: false

jobs:
  staging:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    # Read the existing credentials; the Alchemy stage and domain below are isolated.
    environment: production
    env:
      STAGING_STAGE: staging_android_10416
      STAGING_RELAY_URL: https://relay-staging-android-10416.t3.codes
      RELAY_DOMAIN: relay-staging-android-10416.t3.codes
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
      AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
      RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
      APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
      APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
      APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
      APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
      ALCHEMY_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Guard staging target
        run: |
          test "$GITHUB_REF" = refs/heads/staging/android-pr10416
          test "$STAGING_STAGE" = staging_android_10416
          test "$RELAY_DOMAIN" = relay-staging-android-10416.t3.codes
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3code-relay...
              - --filter=@t3tools/mobile...
      - name: Plan or deploy isolated relay
        if: inputs.phase != 'build'
        env:
          PHASE: ${{ inputs.phase }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          test -n "$FCM_SERVICE_ACCOUNT"
          if [ "$PHASE" = plan ]; then
            vp run --filter t3code-relay deploy --stage "$STAGING_STAGE" --dry-run
          else
            vp run --filter t3code-relay deploy --stage "$STAGING_STAGE" --yes --github-output
          fi
      - name: Expose pnpm
        if: inputs.phase != 'deploy'
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          echo "$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin" >> "$GITHUB_PATH"
      - name: Setup EAS
        if: inputs.phase != 'deploy'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
      - name: Inspect Firebase app configuration
        if: inputs.phase != 'deploy'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          eas env:pull production --path .env.staging-eas-production --non-interactive
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { parseEnv } from 'node:util';
          const file = parseEnv(fs.readFileSync('.env.staging-eas-production', 'utf8')).T3CODE_ANDROID_GOOGLE_SERVICES_FILE;
          if (file && fs.existsSync(file)) fs.copyFileSync(file, '.env.staging-firebase-production.json');
          JS
          eas env:pull preview --path .env.staging-eas-preview --non-interactive
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { parseEnv } from 'node:util';
          const senderProject = JSON.parse(process.env.FCM_SERVICE_ACCOUNT).project_id;
          let selected;
          for (const environment of ['preview', 'production']) {
            const env = parseEnv(fs.readFileSync(`.env.staging-eas-${environment}`, 'utf8'));
            const file = environment === 'production' ? '.env.staging-firebase-production.json' : env.T3CODE_ANDROID_GOOGLE_SERVICES_FILE;
            if (!file || !fs.existsSync(file)) {
              console.log(`${environment}: readable Firebase app configuration is missing`);
              continue;
            }
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            const packages = (config.client ?? []).map(c => c.client_info?.android_client_info?.package_name);
            console.log(`${environment}: Firebase project ${config.project_info.project_id}; packages ${packages.join(', ')}`);
            if (!selected && config.project_info.project_id === senderProject && packages.includes('com.t3tools.t3code.preview')) selected = environment;
          }
          if (!selected) throw new Error('No readable EAS Firebase file matches the relay project and com.t3tools.t3code.preview');
          fs.appendFileSync(process.env.GITHUB_ENV, `STAGING_EAS_ENVIRONMENT=${selected}\n`);
          console.log(`Using ${selected} EAS variables for the staging preview APK`);
          JS
      - name: Build standalone staging APK
        if: inputs.phase == 'build'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          config.build['staging:android'] = {
            extends: 'preview',
            environment: process.env.STAGING_EAS_ENVIRONMENT,
            channel: 'staging-android-10416',
            env: {
              APP_VARIANT: 'preview',
              T3CODE_RELAY_URL: process.env.STAGING_RELAY_URL,
              T3CODE_CLERK_PUBLISHABLE_KEY: process.env.CLERK_PUBLISHABLE_KEY,
              T3CODE_CLERK_JWT_TEMPLATE: 't3-relay',
              T3CODE_MOBILE_UPDATES_ENABLED: '0',
            },
            android: { buildType: 'apk' },
          };
          fs.writeFileSync('eas.json', JSON.stringify(config, null, 2) + '\n');
          JS
          eas build --platform android --profile staging:android --non-interactive --no-wait --json > "$RUNNER_TEMP/staging-android-build.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const builds = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/staging-android-build.json`, 'utf8'));
          for (const build of builds) {
            const url = `https://expo.dev/accounts/pingdotgg/projects/t3-code/builds/${build.id}`;
            console.log(url);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Android staging build: ${url}\nRelay: ${process.env.STAGING_RELAY_URL}\n`);
          }
          JS
      - uses: actions/upload-artifact@v4
        if: inputs.phase == 'build' && success()
        with:
          name: staging-android-build
          path: ${{ runner.temp }}/staging-android-build.json
